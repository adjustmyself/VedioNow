<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>VideoNow</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
            user-select: none;
            cursor: default;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft JhengHei', Roboto, sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            /* 讓使用者可以拖動啟動畫面（無邊框視窗沒有標題列） */
            -webkit-app-region: drag;
        }

        .splash {
            width: 380px;
            padding: 30px 34px 26px;
            border-radius: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 18px 46px rgba(27, 15, 58, 0.42);
            color: #fff;
            text-align: center;
            /* 開窗瞬間淡入＋輕微放大，點擊圖示後的第一個回饋 */
            animation: splash-in 260ms cubic-bezier(0.2, 0.8, 0.3, 1) both;
        }

        /* 收到 splash-finish 後淡出，接手給主視窗 */
        .splash.is-leaving {
            animation: splash-out 220ms ease forwards;
        }

        @keyframes splash-in {
            from { opacity: 0; transform: scale(0.94); }
            to   { opacity: 1; transform: scale(1); }
        }

        @keyframes splash-out {
            from { opacity: 1; transform: scale(1); }
            to   { opacity: 0; transform: scale(0.97); }
        }

        .logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 14px;
            display: block;
            filter: drop-shadow(0 6px 14px rgba(27, 15, 58, 0.35));
            animation: logo-pulse 1.8s ease-in-out infinite;
        }

        @keyframes logo-pulse {
            0%, 100% { transform: scale(1); opacity: 0.95; }
            50%      { transform: scale(1.06); opacity: 1; }
        }

        .title {
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 0.06em;
        }

        .subtitle {
            margin-top: 4px;
            font-size: 0.78rem;
            letter-spacing: 0.12em;
            color: rgba(255, 255, 255, 0.72);
        }

        .progress {
            position: relative;
            width: 100%;
            height: 4px;
            margin: 22px 0 12px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.22);
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 6%;
            border-radius: 2px;
            background: #fff;
            transition: width 320ms cubic-bezier(0.3, 0.8, 0.4, 1);
        }

        /* 單一階段耗時較久時，掃光讓畫面看起來仍在運作 */
        .progress::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 40%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent);
            animation: shimmer 1.4s linear infinite;
        }

        @keyframes shimmer {
            from { transform: translateX(-100%); }
            to   { transform: translateX(350%); }
        }

        .status {
            min-height: 18px;
            font-size: 0.8rem;
            letter-spacing: 0.04em;
            color: rgba(255, 255, 255, 0.88);
        }
    </style>
</head>
<body>
    <div class="splash" id="splash">
        <svg class="logo" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="512" cy="512" r="470" fill="#ffffff" opacity="0.14"/>
            <circle cx="512" cy="512" r="312" fill="#ffffff" opacity="0.16"/>
            <path d="M430 332 L726 512 L430 692 Z"
                  fill="#ffffff" stroke="#ffffff" stroke-width="56" stroke-linejoin="round"/>
        </svg>
        <div class="title">VideoNow</div>
        <div class="subtitle">影片管理程式</div>
        <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
        <div class="status" id="status">正在啟動…</div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');

        const splashEl = document.getElementById('splash');
        const barEl = document.getElementById('progress-bar');
        const statusEl = document.getElementById('status');
        let currentPercent = 6;

        ipcRenderer.on('splash-status', (event, state) => {
            if (!state) return;
            if (typeof state.text === 'string') {
                statusEl.textContent = state.text;
            }
            const percent = Number(state.percent);
            // 進度只進不退，避免訊息順序造成倒退感
            if (!isNaN(percent) && percent > currentPercent) {
                currentPercent = Math.min(percent, 100);
                barEl.style.width = currentPercent + '%';
            }
        });

        ipcRenderer.on('splash-finish', () => {
            barEl.style.width = '100%';
            splashEl.classList.add('is-leaving');
        });
    </script>
</body>
</html>
